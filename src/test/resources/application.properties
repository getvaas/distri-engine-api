spring.datasource.payments-db.jdbc-url=jdbc:h2:mem:payments_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.payments-db.driver-class-name=org.h2.Driver
spring.datasource.payments-db.username=sa
spring.datasource.payments-db.password=

spring.datasource.master-servicer-db.jdbc-url=jdbc:h2:mem:master_servicer_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.master-servicer-db.driver-class-name=org.h2.Driver
spring.datasource.master-servicer-db.username=sa
spring.datasource.master-servicer-db.password=

# H2 arranca vacío en cada test — a diferencia de runtime real (donde nunca se auto-crea/altera el
# schema), acá Hibernate tiene que crear las tablas mapeadas por las entities.
payments-db.hibernate.ddl-auto=create-drop
master-servicer-db.hibernate.ddl-auto=create-drop

vaas.security.enabled=false
